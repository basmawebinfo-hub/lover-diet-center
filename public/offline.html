<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا يوجد اتصال — Lover Diet Center</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; text-align: center;
    background: #f6faf8; color: #1a1f16;
    font-family: 'Dubai','Tajawal','Noto Naskh Arabic','Segoe UI',system-ui,sans-serif;
  }
  .card { max-width: 22rem; }
  img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  h1 { margin: 1.25rem 0 .5rem; font-size: 1.35rem; font-weight: 800; }
  p { margin: 0 0 1.75rem; color: #4a5142; line-height: 1.7; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    background: #10b981; color: #fff; border: 0;
    border-radius: 1rem; padding: .95rem 2rem; min-height: 48px;
  }
  button:active { transform: translateY(1px); }
  .en { margin-top: 1.5rem; font-size: .82rem; color: #767d6c; }
</style>
</head>
<body>
  <div class="card">
    <img src="/ldc-logo.png" alt="">
    <h1>مفيش اتصال بالإنترنت</h1>
    <p>خطتك وبياناتك محفوظة. أول ما الاتصال يرجع هتلاقي كل حاجة زي ما هي.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    <p class="en">You’re offline. Your plan and data are safe — reconnect and everything will be here.</p>
  </div>
</body>
</html>
